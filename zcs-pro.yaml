text_sensor:
  - platform: template
    id: appliance_status
    name: "Appliance Status"
    icon: mdi:state-machine
    update_interval: 1s
    lambda: |-
      if (id(fault_text) != "None") return {"FAULT"};
      if (id(schedule_enabled).state && id(time_source) == 0)
        return {"FAULT"};
      if (id(pump_active) && id(active_source) == VB_PRIME) return {"PRIME"};
      if (id(pump_active)) return {"DOSING"};
      return {"READY"};

  - platform: template
    id: power_saving_status_text
    name: "Power Saving Status"
    icon: mdi:power-sleep
    update_interval: 1s
    lambda: |-
      if (!id(power_saving_enabled).state)
        return {"Disabled — awake continuously"};
      if (id(pump_active)) return {"Enabled — awake while dosing"};
      if (static_cast<int32_t>(id(awake_until_ms) - millis()) <= 0)
        return {"Enabled — preparing test sleep"};
      return {"Enabled — commissioning cycle"};

  - platform: template
    id: wake_reason_text
    name: "Wake Reason"
    icon: mdi:weather-sunset-up
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return {id(wake_reason)};'

  - platform: template
    id: awake_remaining_text
    name: "Awake Time Remaining"
    icon: mdi:timer-outline
    update_interval: 1s
    lambda: |-
      if (!id(power_saving_enabled).state) return {"Continuous"};
      const int32_t remaining_ms =
          static_cast<int32_t>(id(awake_until_ms) - millis());
      if (remaining_ms <= 0) return {"Sleeping now"};
      const uint32_t seconds = static_cast<uint32_t>(remaining_ms) / 1000U;
      char value[32];
      std::snprintf(value, sizeof(value), "%u:%02u",
                    static_cast<unsigned>(seconds / 60U),
                    static_cast<unsigned>(seconds % 60U));
      return {value};

  - platform: template
    id: next_power_wake_text
    name: "Next Power Wake"
    icon: mdi:clock-start
    update_interval: 5s
    lambda: |-
      if (!id(power_saving_enabled).state)
        return {"Not scheduled — power saving disabled"};
      return {"Five minutes after sleep (commissioning mode)"};

  - platform: template
    id: power_action_result_text
    name: "Power Saving Action"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return {id(power_action_result)};'

  - platform: template
    id: current_time_text
    name: "Current Time"
    icon: mdi:clock-outline
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();
      if (!vb_sane_time(now) || id(time_source) == 0)
        return {"Invalid — schedule inhibited"};
      char value[48];
      now.strftime(value, sizeof(value), "%a %b %d, %Y %I:%M:%S %p");
      return {value};

  - platform: template
    id: rtc_status_text
    name: "RTC Status"
    icon: mdi:clock-check-outline
    update_interval: 10s
    lambda: |-
      if (!id(rtc_present)) return {"Not Installed"};
      if (!id(rtc_time_valid)) return {"Installed — invalid time"};
      return {"Installed — valid"};

  - platform: template
    id: rtc_readback_text
    name: "RTC Readback"
    icon: mdi:clock-digital
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      uint8_t registers[7]{};
      const auto read_result =
          id(rtc_time).read_register(0x00, registers, sizeof(registers));
      if (read_result != esphome::i2c::ERROR_OK) {
        id(rtc_present) = false;
        return {"Unavailable — no RTC response"};
      }

      id(rtc_present) = true;
      const auto bcd = [](uint8_t value) -> uint8_t {
        return static_cast<uint8_t>((value >> 4) * 10U + (value & 0x0FU));
      };
      uint8_t hour = 0;
      if ((registers[2] & 0x40U) != 0) {
        const uint8_t hour12 = bcd(registers[2] & 0x1FU);
        hour = static_cast<uint8_t>((hour12 % 12U) +
                                    ((registers[2] & 0x20U) ? 12U : 0U));
      } else {
        hour = bcd(registers[2] & 0x3FU);
      }

      esphome::ESPTime rtc_utc{
          .second = bcd(registers[0] & 0x7FU),
          .minute = bcd(registers[1] & 0x7FU),
          .hour = hour,
          .day_of_week = static_cast<uint8_t>(registers[3] & 0x07U),
          .day_of_month = bcd(registers[4] & 0x3FU),
          .month = bcd(registers[5] & 0x1FU),
          .year = static_cast<uint16_t>(2000U + bcd(registers[6])),
      };
      rtc_utc.recalc_timestamp_utc(false);
      const bool valid =
          rtc_utc.is_valid(/*check_day_of_week=*/true,
                           /*check_day_of_year=*/false) &&
          rtc_utc.year >= 2024 && rtc_utc.year <= 2099;
      id(rtc_time_valid) = valid;
      if (!valid) return {"Invalid — schedule inhibited"};

      auto rtc_local = esphome::ESPTime::from_epoch_local(rtc_utc.timestamp);
      char value[64];
      rtc_local.strftime(value, sizeof(value),
                         "Valid — %a %b %d, %Y %I:%M:%S %p");
      return {value};

  - platform: template
    id: time_status_text
    name: "Time Status"
    icon: mdi:timeline-clock-outline
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!vb_sane_time(now) || id(time_source) == 0)
        return {"FAULT — no valid RTC or network time"};
      if (id(time_source) == 2 && id(rtc_present))
        return {"Network synchronized; RTC corrected"};
      if (id(time_source) == 2) return {"Network time (RTC not installed)"};
      return {"RTC time (network unavailable)"};

  - platform: template
    id: rtc_sync_result_text
    name: "RTC Sync Result"
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: 2s
    lambda: 'return {id(rtc_sync_result)};'

  - platform: template
    id: pump_mode_text
    name: "Pump State"
    icon: mdi:pump
    update_interval: 1s
    lambda: |-
      if (!id(pump_active)) return {"OFF"};
      if (id(active_source) == VB_PRIME) return {"ON — PRIME"};
      if (id(active_source) == VB_CALIBRATION) return {"ON — CALIBRATION"};
      return {"ON — DOSING"};

  - platform: template
    id: last_success_text
    name: "Last Successful Dose"
    icon: mdi:history
    update_interval: 10s
    lambda: 'return {id(last_successful_dose)};'

  - platform: template
    id: last_attempt_text
    name: "Last Attempted Dose"
    icon: mdi:history
    update_interval: 10s
    lambda: 'return {id(last_attempted_dose)};'

  - platform: template
    id: next_schedule_text
    name: "Next Scheduled Dose"
    icon: mdi:calendar-clock
    update_interval: 15s
    lambda: |-
      if (!id(schedule_enabled).state) return {"Disabled"};
      if (id(flow_ml_per_sec) <= 0.0f) return {"Unavailable — calibration required"};
      const auto now = id(sntp_time).now();
      if (!vb_sane_time(now) || id(time_source) == 0)
        return {"Unavailable — time fault"};
      uint8_t mask = 0;
      if (id(day_sunday).state) mask |= 1U << 0;
      if (id(day_monday).state) mask |= 1U << 1;
      if (id(day_tuesday).state) mask |= 1U << 2;
      if (id(day_wednesday).state) mask |= 1U << 3;
      if (id(day_thursday).state) mask |= 1U << 4;
      if (id(day_friday).state) mask |= 1U << 5;
      if (id(day_saturday).state) mask |= 1U << 6;
      if (mask == 0 || id(schedule_dose_ml).state <= 0.0f)
        return {"Not configured"};
      const uint32_t next = vb_next_schedule_epoch(
          now, mask, static_cast<int>(id(schedule_hour).state),
          static_cast<int>(id(schedule_minute).state));
      if (next == 0) return {"Unable to calculate"};
      char value[96];
      std::snprintf(value, sizeof(value), "%s — %.1f mL",
                    vb_format_epoch(next).c_str(), id(schedule_dose_ml).state);
      return {value};

  - platform: template
    id: calibration_status_text
    name: "Calibration Status"
    icon: mdi:flask-outline
    update_interval: 10s
    lambda: |-
      if (id(flow_ml_per_sec) <= 0.0f) return {"UNCALIBRATED — mL dosing disabled"};
      char value[120];
      std::snprintf(value, sizeof(value), "Calibrated %.4f mL/s — %s",
                    id(flow_ml_per_sec), id(calibration_date).c_str());
      return {value};

  - platform: template
    id: daily_limit_status_text
    name: "Daily Dose Limit Status"
    icon: mdi:cup-water
    update_interval: 10s
    lambda: |-
      if (id(flow_ml_per_sec) <= 0.0f)
        return {"Unavailable until calibrated"};
      if (id(max_daily_dose).state <= 0.0f)
        return {"Not configured (0 mL setting)"};
      char value[96];
      std::snprintf(value, sizeof(value), "%.2f / %.2f mL used today",
                    id(today_volume_ml), id(max_daily_dose).state);
      return {value};

  - platform: template
    id: lockout_status_text
    name: "Automatic Dose Lockout"
    icon: mdi:timer-lock-outline
    update_interval: 10s
    lambda: |-
      if (id(last_automatic_epoch) == 0) return {"Ready"};
      const auto now = id(sntp_time).now();
      if (!vb_sane_time(now)) return {"Time invalid"};
      const uint32_t interval_s = static_cast<uint32_t>(
          id(auto_min_interval).state * 60.0f);
      if (now.timestamp >= id(last_automatic_epoch) + interval_s)
        return {"Ready"};
      const uint32_t remaining = id(last_automatic_epoch) + interval_s - now.timestamp;
      char value[64];
      std::snprintf(value, sizeof(value), "%u min remaining",
                    static_cast<unsigned>((remaining + 59U) / 60U));
      return {value};

  - platform: template
    id: fault_status_text
    name: "Faults"
    icon: mdi:alert-circle-outline
    update_interval: 2s
    lambda: |-
      if (id(fault_text) != "None") return {id(fault_text)};
      if (id(schedule_enabled).state && id(time_source) == 0)
        return {"Schedule inhibited: no valid time"};
      return {"None"};

  - platform: template
    name: "Reservoir Status"
    icon: mdi:bottle-tonic-outline
    update_interval: 60s
    lambda: 'return {"Not Installed"};'

  - platform: template
    name: "Flow Verification Status"
    icon: mdi:waves-arrow-right
    update_interval: 60s
    lambda: 'return {"Not Installed"};'

  - platform: template
    name: "Configured Time Zone"
    icon: mdi:map-clock-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {"${timezone_default}"};'

  - platform: template
    name: "Web Admin Password Setting"
    icon: mdi:shield-lock-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {"Managed in secrets.yaml; reflash required to change"};'

  - platform: template
    id: dose_history
    name: "Dose History JSON"
    icon: mdi:history
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: 'return {vb_history(id(dose_history_store)).to_json()};'

