substitutions:
  device_name: zcs-pro
  friendly_name: "ZCS PRO"
  firmware_version: "1.2.2"
  api_encryption_key: !secret api_encryption_key
  timezone_default: "America/New_York"
  pump_gpio: GPIO23
  pump_gpio_idf: GPIO_NUM_23
  pump_inverted: "false"       # Change to "true" only if bench testing proves active LOW.
  prime_button_gpio: GPIO32    # Safe general-purpose pin; not an ESP32 strapping pin.
  prime_button_hold: 3s
  status_led_gpio: GPIO25
  status_led_gpio_idf: GPIO_NUM_25
  i2c_sda_gpio: GPIO21
  i2c_scl_gpio: GPIO22
  manual_awake_ms: '300000U'   # Five-minute management window after a button/cold wake.
  timer_awake_ms: '120000U'    # Two-minute management window after a timer wake.
  test_sleep_duration: 5min    # Recoverable commissioning cycle until the wake button is fitted.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  includes:
    - includes/zcs_pro.h
  project:
    name: "zoogloea-control-system.zcs-pro"
    version: ${firmware_version}
  on_boot:
    # Preload the physical inactive level before making the pump pin an output. This
    # runs ahead of ordinary hardware-component setup under ESP-IDF.
    - priority: 1000
      then:
        - lambda: |-
            const int inactive_level = ${pump_inverted} ? 1 : 0;
            gpio_set_level(${pump_gpio_idf}, inactive_level);
            gpio_set_direction(${pump_gpio_idf}, GPIO_MODE_OUTPUT);
            gpio_set_level(${status_led_gpio_idf}, 1);
            gpio_set_direction(${status_led_gpio_idf}, GPIO_MODE_OUTPUT);
    # The GPIO output component is initialized at the hardware priority. This
    # explicit OFF command runs immediately afterward, before networking/API.
    - priority: 800
      then:
        - output.turn_off: pump_output
        - output.turn_on: status_led_output
        - script.stop: pump_request
        - lambda: |-
            id(pump_active) = false;
            id(active_source) = VB_FAULT;
            id(active_requested_ml) = 0.0f;
            id(active_expected_ml) = 0.0f;
            const auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1) {
              id(wake_reason) = "Physical button";
              id(awake_until_ms) = millis() + ${manual_awake_ms};
            } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              id(wake_reason) = "Test-cycle timer";
              id(awake_until_ms) = millis() + ${timer_awake_ms};
            } else {
              id(wake_reason) = "Power-on or reset";
              id(awake_until_ms) = millis() + ${manual_awake_ms};
            }
    # Read the optional RTC once. A missing device is a non-fatal condition.
    - priority: 600
      then:
        - delay: 300ms
        - ds1307.read_time:
            id: rtc_time
        - delay: 300ms
        - lambda: |-
            id(rtc_present) = !id(rtc_time).is_failed();
            const auto now = id(rtc_time).now();
            id(rtc_time_valid) = id(rtc_present) && vb_sane_time(now);
            if (id(rtc_time_valid)) id(time_source) = 1;
    # Register an authenticated, no-store endpoint used only when the local
    # Settings page explicitly asks to reveal the Home Assistant API key.
    - priority: -100
      then:
        - lambda: |-
            vb_register_api_key_handler("${api_encryption_key}");
  on_shutdown:
    priority: 800
    then:
      - output.turn_off: pump_output
      - output.turn_off: status_led_output
      - script.stop: pump_request
      - lambda: |-
          id(pump_active) = false;
          const auto now = id(sntp_time).now();
          if (vb_sane_time(now)) id(last_clock_epoch) = now.timestamp;

esp32:
  board: esp32dev
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 5min

logger:
  level: INFO

api:
  id: api_server
  reboot_timeout: 0s
  encryption:
    key: ${api_encryption_key}
  actions:
    - action: run_timed
      variables:
        seconds: int
      then:
        - script.execute:
            id: pump_request
            runtime_ms: !lambda 'return seconds * 1000;'
            source: !lambda 'return static_cast<int>(VB_HOME_ASSISTANT);'
            requested_ml: 0.0
            expected_ml: !lambda |-
              return id(flow_ml_per_sec) > 0.0f
                         ? seconds * id(flow_ml_per_sec)
                         : 0.0f;
    - action: dose_volume
      variables:
        milliliters: float
      then:
        - script.execute:
            id: volume_request
            milliliters: !lambda 'return milliliters;'
            source: !lambda 'return static_cast<int>(VB_HOME_ASSISTANT);'
    - action: prime
      then:
        - script.execute:
            id: pump_request
            runtime_ms: !lambda 'return static_cast<int>(id(prime_duration).state * 1000.0f);'
            source: !lambda 'return static_cast<int>(VB_HOME_ASSISTANT);'
            requested_ml: 0.0
            expected_ml: !lambda |-
              return id(flow_ml_per_sec) > 0.0f
                         ? id(prime_duration).state * id(flow_ml_per_sec)
                         : 0.0f;
    - action: stop
      then:
        - script.execute: pump_stop

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: 'id(ota_active) = true;'
        - deep_sleep.prevent: power_save_sleep
        - output.turn_off: pump_output
        - script.stop: pump_request
        - lambda: 'id(pump_active) = false;'
  - platform: web_server
    on_begin:
      then:
        - lambda: 'id(ota_active) = true;'
        - deep_sleep.prevent: power_save_sleep
        - output.turn_off: pump_output
        - script.stop: pump_request
        - lambda: 'id(pump_active) = false;'

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5
  reboot_timeout: 10min
  on_safe_mode:
    then:
      - lambda: |-
          const int inactive_level = ${pump_inverted} ? 1 : 0;
          gpio_set_level(${pump_gpio_idf}, inactive_level);
          gpio_set_direction(${pump_gpio_idf}, GPIO_MODE_OUTPUT);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: "ZCS PRO Setup"
    password: !secret fallback_ap_password
    ap_timeout: 90s

captive_portal:

mdns:

web_server:
  id: local_web
  port: 80
  version: 2
  css_url: ""
  js_url: ""
  css_include: web/zcs-pro.css
  js_include: web/zcs-pro.js
  log: false
  auth:
    type: digest
    username: !secret web_admin_username
    password: !secret web_admin_password

i2c:
  id: i2c_bus
  sda: ${i2c_sda_gpio}
  scl: ${i2c_scl_gpio}
  scan: true
  frequency: 100kHz

time:
  # DS3231 uses the DS1307-compatible register interface at address 0x68.
  # update_interval is disabled so an absent RTC cannot repeatedly interfere.
  - platform: ds1307
    id: rtc_time
    address: 0x68
    timezone: ${timezone_default}
    update_interval: never
  - platform: sntp
    id: sntp_time
    timezone: ${timezone_default}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            const auto now = id(sntp_time).now();
            if (vb_sane_time(now)) {
              id(network_time_synced) = true;
              id(time_source) = 2;
            }
        - if:
            condition:
              lambda: 'return id(rtc_present) && id(network_time_synced);'
            then:
              - ds1307.write_time:
                  id: rtc_time
              - lambda: 'id(rtc_time_valid) = true;'

output:
  - platform: gpio
    id: pump_output
    pin:
      number: ${pump_gpio}
      inverted: ${pump_inverted}

  - platform: gpio
    id: status_led_output
    pin:
      number: ${status_led_gpio}
      inverted: false

deep_sleep:
  id: power_save_sleep
  wakeup_pin:
    number: ${prime_button_gpio}
    inverted: true
    allow_other_uses: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE

# GPIO25 is the awake/dose status LED. GPIO33 is a suggested reservoir input
# and GPIO27 a suggested flow input; neither input is driven/read in v1.2.

globals:
  - id: pump_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pump_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: active_source
    type: int
    restore_value: false
    initial_value: '6'
  - id: active_requested_ml
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: active_expected_ml
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: request_approved
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: awake_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sleep_entry_allowed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: physical_long_armed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: led_pattern_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: led_blink_phase
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wake_reason
    type: std::string
    restore_value: false
    initial_value: '"Power-on or reset"'
  - id: power_action_result
    type: std::string
    restore_value: false
    initial_value: '"Power saving disabled — device remains awake"'
  - id: flow_ml_per_sec
    type: float
    restore_value: true
    update_interval: 5min
    initial_value: '0.0'
  - id: calibration_date
    type: std::string
    restore_value: true
    update_interval: 5min
    max_restore_data_length: 40
    initial_value: '"Never"'
  - id: calibration_run_complete
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_calibration_runtime_seconds
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: lifetime_runtime_seconds
    type: double
    restore_value: true
    update_interval: 5min
    initial_value: '0.0'
  - id: lifetime_volume_ml
    type: double
    restore_value: true
    update_interval: 5min
    initial_value: '0.0'
  - id: today_volume_ml
    type: float
    restore_value: true
    update_interval: 5min
    initial_value: '0.0'
  - id: daily_day_key
    type: uint32_t
    restore_value: true
    update_interval: 5min
    initial_value: '0'
  - id: dose_count
    type: uint32_t
    restore_value: true
    update_interval: 5min
    initial_value: '0'
  - id: last_successful_dose
    type: std::string
    restore_value: true
    update_interval: 5min
    max_restore_data_length: 100
    initial_value: '"None"'
  - id: last_attempted_dose
    type: std::string
    restore_value: true
    update_interval: 5min
    max_restore_data_length: 100
    initial_value: '"None"'
  - id: last_automatic_epoch
    type: uint32_t
    restore_value: true
    update_interval: 5min
    initial_value: '0'
  - id: last_schedule_slot_epoch
    type: uint32_t
    restore_value: true
    update_interval: 5min
    initial_value: '0'
  - id: last_clock_epoch
    type: uint32_t
    restore_value: true
    update_interval: 5min
    initial_value: '0'
  - id: last_clock_checkpoint_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: boot_missed_check_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: schedule_due
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: schedule_due_ml
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: rtc_present
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rtc_time_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rtc_sync_allowed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rtc_sync_result
    type: std::string
    restore_value: false
    initial_value: '"Automatic network sync active"'
  - id: network_time_synced
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: time_source
    type: int
    restore_value: false
    initial_value: '0'  # 0 invalid, 1 RTC, 2 network-corrected
  - id: fault_text
    type: std::string
    restore_value: false
    initial_value: '"None"'
  - id: factory_reset_armed_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dose_history_store
    # A 4-byte-aligned raw blob avoids relying on custom type declarations in
    # ESPHome's generated-global preamble. vb_history() provides the safe view.
    type: uint32_t[502]
    restore_value: true
    update_interval: 5min
    initial_value: 'std::array<uint32_t, 502>{}'

script:
  # This is the only script allowed to energize pump_output. Every automatic,
  # web, button and API run request is routed here.
  - id: pump_request
    mode: single
    parameters:
      runtime_ms: int
      source: int
      requested_ml: float
      expected_ml: float
    then:
      - lambda: |-
          id(request_approved) = false;
          const auto now = id(sntp_time).now();
          const uint32_t epoch = vb_sane_time(now) ? now.timestamp : 0;
          uint8_t rejection = VB_SUCCESS;

          if (vb_sane_time(now)) {
            const uint32_t day_key = vb_local_day_key(now);
            if (day_key != id(daily_day_key)) {
              id(daily_day_key) = day_key;
              id(today_volume_ml) = 0.0f;
            }
          }

          if (id(pump_active)) {
            rejection = VB_REJECTED_BUSY;
          } else if (runtime_ms <= 0 || runtime_ms > 120000 ||
                     runtime_ms > static_cast<int>(id(max_continuous_runtime).state * 1000.0f)) {
            rejection = VB_REJECTED_RUNTIME;
          } else if (requested_ml > 0.0f && id(flow_ml_per_sec) <= 0.0f) {
            rejection = VB_REJECTED_UNCALIBRATED;
          } else if (source == VB_SCHEDULE &&
                     (!vb_sane_time(now) || id(time_source) == 0)) {
            rejection = VB_TIME_INVALID;
          } else if (source == VB_SCHEDULE && id(last_automatic_epoch) > 0 &&
                     epoch > id(last_automatic_epoch) &&
                     epoch - id(last_automatic_epoch) <
                       static_cast<uint32_t>(id(auto_min_interval).state * 60.0f)) {
            rejection = VB_REJECTED_LOCKOUT;
          } else if (source != VB_CALIBRATION && id(flow_ml_per_sec) > 0.0f &&
                     id(max_daily_dose).state > 0.0f &&
                     id(today_volume_ml) +
                       runtime_ms / 1000.0f * id(flow_ml_per_sec) >
                         id(max_daily_dose).state + 0.001f) {
            rejection = VB_REJECTED_DAILY_LIMIT;
          }

          if (rejection != VB_SUCCESS) {
            id(fault_text) = VBHistory::result_name(rejection);
            id(last_attempted_dose) = vb_format_epoch(epoch) + " — " +
                                      VBHistory::result_name(rejection);
            vb_history(id(dose_history_store)).add(
                epoch, requested_ml, expected_ml, 0,
                static_cast<uint8_t>(source), rejection);
            id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());
            ESP_LOGW("zcs_pro", "Pump request rejected: %s",
                     VBHistory::result_name(rejection));
            return;
          }

          id(request_approved) = true;
          id(pump_active) = true;
          id(pump_started_ms) = millis();
          id(active_source) = source;
          id(active_requested_ml) = requested_ml;
          id(active_expected_ml) = expected_ml;
          const uint32_t dose_awake_until =
              millis() + static_cast<uint32_t>(runtime_ms) + 120000U;
          if (static_cast<int32_t>(dose_awake_until - id(awake_until_ms)) > 0)
            id(awake_until_ms) = dose_awake_until;
          id(fault_text) = "None";
          id(last_attempted_dose) = vb_format_epoch(epoch) + " — " +
                                    VBHistory::source_name(source);
          if (source == VB_CALIBRATION) id(calibration_run_complete) = false;
      - if:
          condition:
            lambda: 'return id(request_approved);'
          then:
            - output.turn_on: pump_output
            - delay: !lambda 'return static_cast<uint32_t>(runtime_ms);'
            - output.turn_off: pump_output
            - lambda: |-
                if (!id(pump_active)) return;
                const uint32_t elapsed = millis() - id(pump_started_ms);
                const auto now = id(sntp_time).now();
                const uint32_t epoch = vb_sane_time(now) ? now.timestamp : 0;
                float calculated_ml = 0.0f;
                id(lifetime_runtime_seconds) += elapsed / 1000.0;
                if (id(active_source) != VB_CALIBRATION && id(flow_ml_per_sec) > 0.0f) {
                  calculated_ml = elapsed / 1000.0f * id(flow_ml_per_sec);
                  id(lifetime_volume_ml) += calculated_ml;
                  id(today_volume_ml) += calculated_ml;
                }
                id(dose_count)++;
                if (id(active_source) == VB_SCHEDULE) id(last_automatic_epoch) = epoch;
                if (id(active_source) == VB_CALIBRATION) {
                  id(calibration_run_complete) = true;
                  id(last_calibration_runtime_seconds) = elapsed / 1000.0f;
                }
                char detail[128];
                std::snprintf(detail, sizeof(detail), "%s — %s, %.2f mL, %.1f s",
                              vb_format_epoch(epoch).c_str(),
                              VBHistory::source_name(id(active_source)), calculated_ml,
                              elapsed / 1000.0f);
                id(last_successful_dose) = detail;
                vb_history(id(dose_history_store)).add(
                    epoch, id(active_requested_ml), calculated_ml, elapsed,
                    static_cast<uint8_t>(id(active_source)), VB_SUCCESS);
                id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());
                id(pump_active) = false;
                id(active_requested_ml) = 0.0f;
                id(active_expected_ml) = 0.0f;
                id(active_source) = VB_FAULT;
                const uint32_t post_dose_awake = millis() + 120000U;
                if (static_cast<int32_t>(post_dose_awake - id(awake_until_ms)) > 0)
                  id(awake_until_ms) = post_dose_awake;

  - id: pump_stop
    mode: restart
    then:
      # OFF is issued before cancellation/cleanup so STOP has priority.
      - output.turn_off: pump_output
      - script.stop: pump_request
      - lambda: |-
          if (!id(pump_active)) {
            id(active_requested_ml) = 0.0f;
            id(active_expected_ml) = 0.0f;
            id(active_source) = VB_FAULT;
            return;
          }
          const uint32_t elapsed = millis() - id(pump_started_ms);
          const auto now = id(sntp_time).now();
          const uint32_t epoch = vb_sane_time(now) ? now.timestamp : 0;
          float calculated_ml = 0.0f;
          id(lifetime_runtime_seconds) += elapsed / 1000.0;
          if (id(active_source) != VB_CALIBRATION && id(flow_ml_per_sec) > 0.0f) {
            calculated_ml = elapsed / 1000.0f * id(flow_ml_per_sec);
            id(lifetime_volume_ml) += calculated_ml;
            id(today_volume_ml) += calculated_ml;
          }
          vb_history(id(dose_history_store)).add(
              epoch, id(active_requested_ml), calculated_ml, elapsed,
              static_cast<uint8_t>(id(active_source)), VB_STOPPED);
          id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());
          id(last_attempted_dose) = vb_format_epoch(epoch) + " — Stopped";
          id(pump_active) = false;
          id(active_requested_ml) = 0.0f;
          id(active_expected_ml) = 0.0f;
          id(active_source) = VB_FAULT;
          id(fault_text) = "None";

  - id: volume_request
    mode: single
    parameters:
      milliliters: float
      source: int
    then:
      - if:
          condition:
            lambda: 'return id(flow_ml_per_sec) > 0.0f && milliliters > 0.0f;'
          then:
            - script.execute:
                id: pump_request
                runtime_ms: !lambda |-
                  return static_cast<int>(std::ceil(
                      milliliters / id(flow_ml_per_sec) * 1000.0f));
                source: !lambda 'return source;'
                requested_ml: !lambda 'return milliliters;'
                expected_ml: !lambda 'return milliliters;'
          else:
            - lambda: |-
                const auto now = id(sntp_time).now();
                const uint32_t epoch = vb_sane_time(now) ? now.timestamp : 0;
                id(fault_text) = "Volume dosing unavailable: calibration required";
                id(last_attempted_dose) = vb_format_epoch(epoch) +
                                          " — Rejected: uncalibrated";
                vb_history(id(dose_history_store)).add(
                    epoch, milliliters, 0.0f, 0, static_cast<uint8_t>(source),
                    VB_REJECTED_UNCALIBRATED);
                id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());

  - id: physical_button_hold
    mode: restart
    then:
      - delay: ${prime_button_hold}
      - if:
          condition:
            lambda: 'return id(prime_button).state && !id(pump_active);'
          then:
            - lambda: |-
                id(physical_long_armed) = true;
                id(led_pattern_active) = true;
            - repeat:
                count: 3
                then:
                  - output.turn_off: status_led_output
                  - delay: 150ms
                  - output.turn_on: status_led_output
                  - delay: 150ms
            - lambda: 'id(led_pattern_active) = false;'

  - id: controlled_power_sleep
    mode: single
    then:
      - lambda: |-
          id(sleep_entry_allowed) =
              id(power_saving_enabled).state && !id(pump_active) &&
              !id(ota_active) && !id(prime_button).state &&
              !id(led_pattern_active);
      - if:
          condition:
            lambda: 'return id(sleep_entry_allowed);'
          then:
            - output.turn_off: pump_output
            - output.turn_off: status_led_output
            - lambda: |-
                id(pump_active) = false;
                id(last_clock_epoch) = vb_sane_time(id(sntp_time).now())
                                           ? id(sntp_time).now().timestamp
                                           : id(last_clock_epoch);
                esphome::global_preferences->sync();
            - delay: 100ms
            - deep_sleep.enter:
                id: power_save_sleep
                sleep_duration: ${test_sleep_duration}
          else:
            - output.turn_on: status_led_output

  - id: schedule_tick
    mode: single
    then:
      - lambda: |-
          id(schedule_due) = false;
          const auto now = id(sntp_time).now();
          if (!vb_sane_time(now) || id(time_source) == 0) return;

          const uint32_t day_key = vb_local_day_key(now);
          if (day_key != id(daily_day_key)) {
            id(daily_day_key) = day_key;
            id(today_volume_ml) = 0.0f;
          }

          uint8_t mask = 0;
          if (id(day_sunday).state) mask |= 1U << 0;
          if (id(day_monday).state) mask |= 1U << 1;
          if (id(day_tuesday).state) mask |= 1U << 2;
          if (id(day_wednesday).state) mask |= 1U << 3;
          if (id(day_thursday).state) mask |= 1U << 4;
          if (id(day_friday).state) mask |= 1U << 5;
          if (id(day_saturday).state) mask |= 1U << 6;

          if (!id(boot_missed_check_done)) {
            const uint32_t missed = vb_missed_schedule_epoch(
                id(last_clock_epoch), now.timestamp, mask,
                static_cast<int>(id(schedule_hour).state),
                static_cast<int>(id(schedule_minute).state));
            if (id(schedule_enabled).state && missed > 0 &&
                missed != id(last_schedule_slot_epoch)) {
              vb_history(id(dose_history_store)).add(
                  missed, id(schedule_dose_ml).state, 0.0f, 0,
                  VB_MISSED_SCHEDULE, VB_MISSED);
              id(last_attempted_dose) = vb_format_epoch(missed) +
                                        " — Missed schedule (skipped)";
              id(last_schedule_slot_epoch) = missed;
              id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());
            }
            id(boot_missed_check_done) = true;
          }

          if (millis() - id(last_clock_checkpoint_ms) >= 300000U) {
            id(last_clock_checkpoint_ms) = millis();
            id(last_clock_epoch) = now.timestamp;
          }

          const uint8_t today_bit = static_cast<uint8_t>(1U << (now.day_of_week - 1));
          if (!id(schedule_enabled).state || (mask & today_bit) == 0 ||
              now.hour != static_cast<int>(id(schedule_hour).state) ||
              now.minute != static_cast<int>(id(schedule_minute).state) ||
              now.second > 2 || id(schedule_dose_ml).state <= 0.0f)
            return;

          const uint32_t slot_epoch =
              vb_schedule_epoch(now, now.hour, now.minute);
          if (slot_epoch == id(last_schedule_slot_epoch)) return;

          // Mark the slot consumed before requesting a run. A rejection is
          // never silently retried during the same scheduled minute.
          id(last_schedule_slot_epoch) = slot_epoch;
          id(schedule_due_ml) = id(schedule_dose_ml).state;
          id(schedule_due) = true;
      - if:
          condition:
            lambda: 'return id(schedule_due);'
          then:
            - script.execute:
                id: volume_request
                milliliters: !lambda 'return id(schedule_due_ml);'
                source: !lambda 'return static_cast<int>(VB_SCHEDULE);'

interval:
  # Independent runtime watchdog. This is deliberately separate from the
  # normal delay so the configured and absolute 120-second limits always win.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              if (!id(pump_active)) return false;
              const uint32_t configured = static_cast<uint32_t>(
                  id(max_continuous_runtime).state * 1000.0f);
              const uint32_t limit = std::min<uint32_t>(120000U, configured);
              return millis() - id(pump_started_ms) > limit;
          then:
            - output.turn_off: pump_output
            - script.stop: pump_request
            - lambda: |-
                if (!id(pump_active)) return;
                const uint32_t elapsed = millis() - id(pump_started_ms);
                const auto now = id(sntp_time).now();
                const uint32_t epoch = vb_sane_time(now) ? now.timestamp : 0;
                float calculated_ml = 0.0f;
                id(lifetime_runtime_seconds) += elapsed / 1000.0;
                if (id(active_source) != VB_CALIBRATION && id(flow_ml_per_sec) > 0.0f) {
                  calculated_ml = elapsed / 1000.0f * id(flow_ml_per_sec);
                  id(lifetime_volume_ml) += calculated_ml;
                  id(today_volume_ml) += calculated_ml;
                }
                vb_history(id(dose_history_store)).add(
                    epoch, id(active_requested_ml), calculated_ml, elapsed,
                    VB_FAULT, VB_ABORTED_WATCHDOG);
                id(dose_history).publish_state(vb_history(id(dose_history_store)).to_json());
                id(last_attempted_dose) = vb_format_epoch(epoch) +
                                          " — Runtime watchdog abort";
                id(fault_text) = "Maximum continuous runtime watchdog tripped";
                id(pump_active) = false;
                id(active_source) = VB_FAULT;
                id(active_requested_ml) = 0.0f;
                id(active_expected_ml) = 0.0f;
  - interval: 1s
    then:
      - script.execute: schedule_tick
      - if:
          condition:
            lambda: |-
              return id(power_saving_enabled).state && !id(pump_active) &&
                     static_cast<int32_t>(id(awake_until_ms) - millis()) <= 0;
          then:
            - script.execute: controlled_power_sleep
  - interval: 500ms
    then:
      - lambda: |-
          if (id(led_pattern_active)) return;
          if (id(pump_active)) {
            id(led_blink_phase) = !id(led_blink_phase);
            if (id(led_blink_phase))
              id(status_led_output).turn_on();
            else
              id(status_led_output).turn_off();
          } else {
            id(led_blink_phase) = false;
            id(status_led_output).turn_on();
          }

