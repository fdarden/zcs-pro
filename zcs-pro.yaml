      then:
        - if:
            condition:
              switch.is_on: power_saving_enabled
            then:
              - lambda: 'id(power_action_result) = "Entering five-minute test sleep";'
              - script.execute: controlled_power_sleep
            else:
              - lambda: |-
                  id(power_action_result) =
                      "Sleep rejected — enable Power Saving first";

  - platform: template
    name: "Sync RTC from Network Time"
    icon: mdi:clock-sync-outline
    entity_category: config
    on_press:
      then:
        - lambda: |-
            id(rtc_sync_allowed) = false;
            const auto now = id(sntp_time).now();
            if (!id(network_time_synced) || !vb_sane_time(now)) {
              id(rtc_sync_result) =
                  "Not synchronized — valid network time is required";
              return;
            }

            uint8_t seconds_register = 0;
            const auto probe =
                id(rtc_time).read_register(0x00, &seconds_register, 1);
            if (probe != esphome::i2c::ERROR_OK) {
              id(rtc_present) = false;
              id(rtc_time_valid) = false;
              char message[80];
              std::snprintf(message, sizeof(message),
                            "Sync failed — no RTC response at 0x68 (I2C error %d)",
                            static_cast<int>(probe));
              id(rtc_sync_result) = message;
              return;
            }

            id(rtc_present) = true;
            id(rtc_sync_allowed) = true;
            id(rtc_sync_result) = "Synchronizing RTC…";
        - if:
            condition:
              lambda: 'return id(rtc_sync_allowed);'
            then:
              - ds1307.write_time:
                  id: rtc_time
              - delay: 300ms
              - lambda: |-
                  uint8_t registers[7]{};
                  const auto read_result =
                      id(rtc_time).read_register(0x00, registers, sizeof(registers));
                  if (read_result != esphome::i2c::ERROR_OK) {
                    id(rtc_time_valid) = false;
                    id(rtc_sync_allowed) = false;
                    id(rtc_sync_result) =
                        "Sync failed — RTC did not answer the verification read";
                    return;
                  }

                  const auto bcd = [](uint8_t value) -> uint8_t {
                    return static_cast<uint8_t>((value >> 4) * 10U +
                                                (value & 0x0FU));
                  };
                  uint8_t hour = 0;
                  if ((registers[2] & 0x40U) != 0) {
                    const uint8_t hour12 = bcd(registers[2] & 0x1FU);
                    hour = static_cast<uint8_t>((hour12 % 12U) +
                                                ((registers[2] & 0x20U) ? 12U : 0U));
                  } else {
                    hour = bcd(registers[2] & 0x3FU);
                  }

                  esphome::ESPTime rtc_value{
                      .second = bcd(registers[0] & 0x7FU),
                      .minute = bcd(registers[1] & 0x7FU),
                      .hour = hour,
                      .day_of_week = static_cast<uint8_t>(registers[3] & 0x07U),
                      .day_of_month = bcd(registers[4] & 0x3FU),
                      .month = bcd(registers[5] & 0x1FU),
                      .year = static_cast<uint16_t>(2000U + bcd(registers[6])),
                  };
                  rtc_value.recalc_timestamp_utc(false);
                  const auto network_utc = id(sntp_time).utcnow();
                  const int64_t drift =
                      static_cast<int64_t>(rtc_value.timestamp) -
                      static_cast<int64_t>(network_utc.timestamp);
                  const uint64_t absolute_drift =
                      static_cast<uint64_t>(drift < 0 ? -drift : drift);

                  uint8_t status_register = 0;
                  const auto status_read =
                      id(rtc_time).read_register(0x0F, &status_register, 1);
                  bool status_ok = status_read == esphome::i2c::ERROR_OK;
                  if (status_ok && (status_register & 0x80U) != 0) {
                    status_register &= static_cast<uint8_t>(~0x80U);
                    status_ok = id(rtc_time).write_register(
                                    0x0F, &status_register, 1) ==
                                esphome::i2c::ERROR_OK;
                  }

                  // A raw RTC register read has no day-of-year field. Validate
                  // the fields that the DS3231 actually stores instead of the
                  // general helper, which expects day-of-year to be populated.
                  const bool rtc_fields_valid =
                      rtc_value.is_valid(/*check_day_of_week=*/true,
                                         /*check_day_of_year=*/false) &&
                      rtc_value.year >= 2024 && rtc_value.year <= 2099;
                  if (!rtc_fields_valid || absolute_drift > 5U ||
                      !status_ok) {
                    id(rtc_time_valid) = false;
                    id(rtc_sync_allowed) = false;
                    id(rtc_sync_result) =
                        "Sync failed — RTC verification did not match network time";
                    return;
                  }

                  id(rtc_present) = true;
                  id(rtc_time_valid) = true;
                  id(time_source) = 2;
                  id(rtc_sync_result) =
                      "Synchronized and verified from network time";
              - if:
                  condition:
                    lambda: 'return id(rtc_sync_allowed);'
                  then:
                    - ds1307.read_time:
                        id: rtc_time

  - platform: template
    name: "Reboot Device"
    icon: mdi:restart
    entity_category: config
    on_press:
      then:
        - script.execute: pump_stop
        - delay: 100ms
        - button.press: reboot_internal

  - platform: template
    name: "Arm Factory Reset"
    icon: mdi:shield-key-outline
    entity_category: config
    on_press:
      then:
        - lambda: 'id(factory_reset_armed_until) = millis() + 30000U;'

  - platform: template
    name: "Confirm Factory Reset"
    icon: mdi:delete-forever-outline
    entity_category: config
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(factory_reset_armed_until) != 0 &&
                       static_cast<int32_t>(id(factory_reset_armed_until) - millis()) > 0;
            then:
              - output.turn_off: pump_output
              - script.stop: pump_request
              - button.press: factory_reset_internal
            else:
              - lambda: 'id(fault_text) = "Factory reset not armed";'

  - platform: restart
    id: reboot_internal
    internal: true
  - platform: factory_reset
    id: factory_reset_internal
    internal: true

