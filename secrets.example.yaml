# Copy this file to secrets.yaml and replace every example value before compile.
# Keep API encryption, OTA, web-admin and Wi-Fi credentials distinct.

wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# At least 8 characters; used only by the fallback provisioning access point.
fallback_ap_password: "CHANGE-ME-AP-1234"

# Generate with: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY="

# Generate with: openssl rand -base64 32
ota_password: "REPLACE_WITH_A_LONG_RANDOM_OTA_PASSWORD"

web_admin_username: "admin"
# ESPHome web authentication is provisioned at compile time. See README.md.
web_admin_password: "REPLACE_WITH_A_LONG_UNIQUE_WEB_PASSWORD"

